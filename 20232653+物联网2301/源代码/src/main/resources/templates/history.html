<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>问答历史 · 智问</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="nav">
    <a class="nav-brand" href="/">
        <span class="nav-logo">智</span>
        <span>智问 · AI 智能问答平台</span>
    </a>
    <nav class="nav-links">
        <a href="/">首页</a>
        <a href="/chat">智能问答</a>
        <a href="/history" class="active">问答历史</a>
    </nav>
    <div class="nav-right">
        <a class="nav-user" href="/history">
            <span class="avatar" id="userAvatar">·</span>
            <span id="userName">加载中</span>
        </a>
        <button class="btn btn-ghost btn-sm" data-logout>退出</button>
    </div>
</header>

<div class="page-wrap">
    <div class="page-head">
        <div>
            <h1>我的问答历史</h1>
            <div class="sub" id="histSub">共 0 个会话</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:10px;">
            <button class="btn btn-ghost btn-sm" id="clearBtn">清空全部</button>
            <a class="btn btn-primary btn-sm" href="/chat">去提问</a>
        </div>
    </div>

    <div id="histList"></div>
</div>

<script src="/js/common.js"></script>
<script src="/js/history.js"></script>
</body>
</html>
