<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 · 智问</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <div class="nav-logo">智</div>
            <h1>创建账号</h1>
            <p>注册后即可使用智能问答与历史记录功能</p>
        </div>

        <div class="alert alert-error" id="errBox"></div>

        <form id="registerForm" autocomplete="off">
            <div class="form-item">
                <label for="username">用户名</label>
                <input class="input" type="text" id="username" placeholder="4~20 位字母、数字或下划线" required>
                <div class="form-tip">登录时使用，注册后不可修改</div>
            </div>
            <div class="form-item">
                <label for="nickname">昵称</label>
                <input class="input" type="text" id="nickname" placeholder="展示在问答记录中" required>
            </div>
            <div class="form-item">
                <label for="email">邮箱（选填）</label>
                <input class="input" type="email" id="email" placeholder="example@iot.edu.cn">
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <input class="input" type="password" id="password" placeholder="6~32 位" required>
            </div>
            <div class="form-item">
                <label for="confirmPassword">确认密码</label>
                <input class="input" type="password" id="confirmPassword" placeholder="请再次输入密码" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit" id="submitBtn">注 册</button>
        </form>

        <div class="auth-foot">
            已有账号？<a href="/login">直接登录</a>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
