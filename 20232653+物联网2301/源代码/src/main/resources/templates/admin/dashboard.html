<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据看板 · 智问管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<div id="sidebarMount"></div>

<div class="admin-main">
    <header id="topbarMount"></header>

    <div class="content">

        <div class="stat-grid" id="statGrid"></div>

        <div class="chart-grid">
            <div class="panel">
                <div class="panel-head"><h2>近 7 天提问趋势</h2></div>
                <div class="panel-body"><div class="chart" id="chartTrend"></div></div>
            </div>
            <div class="panel">
                <div class="panel-head"><h2>答案来源占比</h2></div>
                <div class="panel-body"><div class="chart" id="chartSource"></div></div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="panel">
                <div class="panel-head"><h2>各分类知识条目数量</h2></div>
                <div class="panel-body"><div class="chart chart-sm" id="chartCategory"></div></div>
            </div>
            <div class="panel">
                <div class="panel-head"><h2>用户活跃时段分布</h2></div>
                <div class="panel-body"><div class="chart chart-sm" id="chartHour"></div></div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="panel">
                <div class="panel-head"><h2>热门知识条目 TOP 10</h2></div>
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                        <tr><th style="width:60px;">排名</th><th>标准问题</th><th style="width:110px;">命中次数</th></tr>
                        </thead>
                        <tbody id="hotKnowledgeBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="panel">
                <div class="panel-head"><h2>用户提问 TOP 10</h2></div>
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                        <tr><th style="width:60px;">排名</th><th>提问内容</th><th style="width:90px;">次数</th></tr>
                        </thead>
                        <tbody id="hotQuestionBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin/admin-common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="/js/admin/dashboard.js"></script>
</body>
</html>
