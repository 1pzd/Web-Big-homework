<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>问答记录 · 智问管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<div id="sidebarMount"></div>

<div class="admin-main">
    <header id="topbarMount"></header>

    <div class="content">
        <div class="panel">
            <div class="panel-head">
                <h2>全部会话</h2>
                <div class="right">
                    <div class="toolbar">
                        <input class="input grow" id="keyword" placeholder="按会话标题搜索">
                        <button class="btn btn-ghost btn-sm" id="searchBtn">查询</button>
                    </div>
                </div>
            </div>

            <div class="table-wrap">
                <table class="data">
                    <thead>
                    <tr>
                        <th style="width:64px;">ID</th>
                        <th>会话标题</th>
                        <th style="width:100px;">用户 ID</th>
                        <th style="width:100px;">消息数</th>
                        <th style="width:160px;">最后活跃</th>
                        <th style="width:150px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="pager" id="pager"></div>
        </div>
    </div>
</div>

<div class="modal-mask" id="modal">
    <div class="modal">
        <div class="modal-head">
            <h3 id="modalTitle">对话详情</h3>
            <button class="x" id="modalClose">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot">
            <button class="btn btn-ghost" id="closeBtn">关闭</button>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin/admin-common.js"></script>
<script src="/js/admin/message.js"></script>
</body>
</html>
