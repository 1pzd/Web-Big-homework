<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员登录 · 智问</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <div class="nav-logo">智</div>
            <h1>管理后台登录</h1>
            <p>仅限管理员账号访问</p>
        </div>

        <div class="alert alert-error" id="errBox"></div>

        <form id="adminLoginForm" autocomplete="off">
            <div class="form-item">
                <label for="username">管理员账号</label>
                <input class="input" type="text" id="username" placeholder="请输入管理员用户名" required>
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <input class="input" type="password" id="password" placeholder="请输入密码" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit" id="submitBtn">登 录 后 台</button>
        </form>

        <div class="auth-foot">
            <a href="/">返回网站首页</a>
        </div>
        <div class="auth-foot" style="margin-top:8px;font-size:12px;">
            默认管理员：admin / admin123
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin/login.js"></script>
</body>
</html>
