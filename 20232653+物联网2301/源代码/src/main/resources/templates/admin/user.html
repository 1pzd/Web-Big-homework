<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户管理 · 智问管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<div id="sidebarMount"></div>

<div class="admin-main">
    <header id="topbarMount"></header>

    <div class="content">
        <div class="panel">
            <div class="panel-head">
                <h2>用户列表</h2>
                <div class="right">
                    <div class="toolbar">
                        <input class="input grow" id="keyword" placeholder="搜索用户名或昵称">
                        <select class="input" id="roleFilter">
                            <option value="">全部角色</option>
                            <option value="ADMIN">管理员</option>
                            <option value="USER">普通用户</option>
                        </select>
                        <button class="btn btn-ghost btn-sm" id="searchBtn">查询</button>
                    </div>
                </div>
            </div>

            <div class="table-wrap">
                <table class="data">
                    <thead>
                    <tr>
                        <th style="width:64px;">ID</th>
                        <th>用户名</th>
                        <th>昵称</th>
                        <th>邮箱</th>
                        <th style="width:100px;">角色</th>
                        <th style="width:90px;">状态</th>
                        <th style="width:150px;">注册时间</th>
                        <th style="width:210px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="pager" id="pager"></div>
        </div>
    </div>
</div>

<div class="modal-mask" id="modal">
    <div class="modal" style="max-width:420px;">
        <div class="modal-head">
            <h3>重置密码</h3>
            <button class="x" id="modalClose">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="formId">
            <div class="form-item">
                <label for="formPassword">新密码（6~32 位）</label>
                <input class="input" type="text" id="formPassword" placeholder="请输入新密码">
            </div>
            <div class="form-tip">重置后请通知用户使用新密码登录。</div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" id="cancelBtn">取消</button>
            <button class="btn btn-primary" id="saveBtn">确认重置</button>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin/admin-common.js"></script>
<script src="/js/admin/user.js"></script>
</body>
</html>
