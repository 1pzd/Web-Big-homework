<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 智问</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <div class="nav-logo">智</div>
            <h1>欢迎回来</h1>
            <p>登录后即可提问、查看历史记录</p>
        </div>

        <div class="alert alert-error" id="errBox"></div>

        <form id="loginForm" autocomplete="off">
            <div class="form-item">
                <label for="username">用户名</label>
                <input class="input" type="text" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <input class="input" type="password" id="password" placeholder="请输入密码" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit" id="submitBtn">登 录</button>
        </form>

        <div class="auth-foot">
            还没有账号？<a href="/register">立即注册</a>
        </div>
        <div class="auth-foot" style="margin-top:8px;font-size:12px;">
            演示账号：user / 123456 &nbsp;·&nbsp; 管理员：admin / admin123
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
