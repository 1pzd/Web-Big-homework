server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 20
    accept-count: 200

spring:
  application:
    name: ai-qa-platform

  # ---------------- 数据源（HikariCP 连接池） ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_qa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    hikari:
      pool-name: AiQaHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ---------------- 模板引擎 ----------------
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.iot.qa.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto

# ---------------- 业务自定义配置 ----------------
ai:
  jwt:
    # HS256 要求密钥长度不少于 32 字节
    secret: ai-qa-platform-20232653-iot-2301-secret-key-2026
    # token 有效期（秒）
    expire: 7200
    header: Authorization
    prefix: "Bearer "
  engine:
    # local = 本地知识库检索；llm = 调用大模型接口
    mode: local
    # 本地检索命中阈值，低于该值返回兜底话术
    threshold: 0.25
  llm:
    base-url: https://api.openai.com/v1
    api-key: ""
    model: gpt-4o-mini
    timeout: 30000